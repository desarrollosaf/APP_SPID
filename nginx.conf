server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Compresion
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Redirigir /spid -> /spid/
    location = /spid {
        return 301 /spid/;
    }

    # La SPA se sirve bajo /spid/ con fallback a index.html
    # para que funcionen las rutas del router de Angular (deep links).
    location /spid/ {
        try_files $uri $uri/ /spid/index.html;

        # Los archivos con hash en el nombre se pueden cachear "para siempre".
        location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }
    }

    # Nunca cachear el index.html (para que tomen builds nuevos)
    location = /spid/index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Healthcheck simple
    location = /spid/health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
