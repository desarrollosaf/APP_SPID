server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    # Redirigir /spid a /spid/
    location = /spid {
        return 301 /spid/;
    }

    # Healthcheck
    location = /spid/health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # No almacenar en caché el index principal
    location = /spid/index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";

        try_files $uri =404;
    }

    # Archivos estáticos con caché prolongada
    location ~* ^/spid/.*\.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";

        try_files $uri =404;
    }

    # Aplicación SPA y rutas de Angular/Ionic
    location /spid/ {
        try_files $uri $uri/ /spid/index.html;
    }

    # Cualquier otra ruta devuelve 404
    location / {
        return 404;
    }
}