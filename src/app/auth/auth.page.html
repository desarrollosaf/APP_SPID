<ion-content class="login-content">

  <!-- Overlay de gradiente (funciona con y sin imagen de fondo) -->
  <div class="bg-overlay"></div>

  <div class="login-wrap">

    <!-- ── BLOQUE SUPERIOR: Logo + Institución ─────────────────── -->
    <div class="login-top">
      <!-- <div class="logo-ring">
        <img src="assets/congreso_fondo_blanco.png" class="login-logo" alt="Congreso">
      </div> --><br><br><br><br><br><br><br><br>
      <div class="login-inst">Congreso del Estado de México</div>
      <div class="login-sys">Sistema de Votación Digital</div>
    </div>

    <!-- ── TARJETA DE FORMULARIO ───────────────────────────────── -->
    <div class="login-card">

      <div class="login-greeting">Bienvenido</div>
      <div class="login-greeting-sub">Ingresa tus credenciales para continuar</div>

      <!-- Campo Usuario -->
      <div class="field-wrap">
        <ion-icon name="person-outline" class="field-ico"></ion-icon>
        <ion-input
          class="field-input"
          placeholder="Usuario"
          [(ngModel)]="usuario"
          type="text"
          autocomplete="username">
        </ion-input>
      </div>

      <!-- Campo Contraseña -->
      <div class="field-wrap">
        <ion-icon name="lock-closed-outline" class="field-ico"></ion-icon>
        <ion-input
          class="field-input"
          placeholder="Contraseña"
          [(ngModel)]="password"
          [type]="showPassword ? 'text' : 'password'"
          autocomplete="current-password">
        </ion-input>
        <button class="eye-btn" (click)="togglePassword()" type="button" aria-label="Mostrar contraseña">
          <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
        </button>
      </div>

      <!-- Botón Iniciar Sesión -->
      <button class="login-btn" (click)="login()">
        Iniciar Sesión
      </button>

    </div>

  </div>

</ion-content>
