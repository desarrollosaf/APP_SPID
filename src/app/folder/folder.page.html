<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button auto-hide="false"></ion-menu-button>
    </ion-buttons>
    <div class="toolbar-name-block">
      <span class="tnb-greeting">Hola,</span>
      <span class="tnb-name">{{ nombreDiputado }}</span>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="page-pad home-wrap">

    <!-- Hero -->
    <div class="hero">
      <div class="hero-date">{{ fechaHoy }}</div>
      <div class="hero-title">Sistema de Votación Digital</div>
      <div class="hero-sub">Registra tu asistencia y emite tu voto desde aquí.</div>
      <ion-icon name="finger-print" class="hero-art"></ion-icon>
    </div>

    <!-- Accesos rápidos -->
    <div class="section-title">Accesos rápidos</div>

    <div class="quick-grid">
      <a class="quick-card" routerLink="/tabs/sesiones">
        <span class="qc-ico qc-ico--brand"><ion-icon name="library"></ion-icon></span>
        <span class="qc-title">Sesión del Pleno</span>
        <span class="qc-sub">Asistencia y votaciones</span>
      </a>

      <a class="quick-card" routerLink="/tabs/comisiones">
        <span class="qc-ico qc-ico--info"><ion-icon name="people"></ion-icon></span>
        <span class="qc-title">Mis comisiones</span>
        <span class="qc-sub">Eventos e integrantes</span>
      </a>
    </div>

    <a class="list-card" routerLink="/cambiar-password">
      <span class="qc-ico qc-ico--neutral"><ion-icon name="key"></ion-icon></span>
      <span class="lc-text">
        <span class="qc-title">Seguridad</span>
        <span class="qc-sub">Cambiar contraseña</span>
      </span>
      <ion-icon name="chevron-forward" class="lc-chev"></ion-icon>
    </a>

    <div class="home-foot">
      <img src="assets/congreso_logo.png" alt="Congreso del Estado de México" />
    </div>

  </div>
</ion-content>
