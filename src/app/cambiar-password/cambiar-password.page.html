<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/inicio"></ion-back-button>
    </ion-buttons>
    <ion-title>Cambiar contraseña</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="cp-content">
  <div class="cp-wrap">

    <div class="cp-header">
      <ion-icon name="key-outline" class="cp-header-ico"></ion-icon>
      <div class="cp-header-title">Actualiza tu contraseña</div>
      <div class="cp-header-sub">Elige una contraseña segura para proteger tu cuenta</div>
    </div>

    <div class="cp-card">

      <div class="field-wrap" [class.field-disabled]="loading">
        <ion-icon name="key-outline" class="field-ico"></ion-icon>
        <ion-input class="field-input" placeholder="Nueva contraseña"
          [(ngModel)]="newPassword"
          [type]="showNew ? 'text' : 'password'"
          autocomplete="new-password">
        </ion-input>
        <button class="eye-btn" (click)="toggleNew()" type="button">
          <ion-icon [name]="showNew ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
        </button>
      </div>

      <div class="field-wrap" [class.field-disabled]="loading">
        <ion-icon name="key-outline" class="field-ico"></ion-icon>
        <ion-input class="field-input" placeholder="Confirmar nueva contraseña"
          [(ngModel)]="confirmPassword"
          [type]="showConfirm ? 'text' : 'password'"
          autocomplete="new-password">
        </ion-input>
        <button class="eye-btn" (click)="toggleConfirm()" type="button">
          <ion-icon [name]="showConfirm ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
        </button>
      </div>

      <button class="cp-btn"
              [class.btn-loading]="loading"
              (click)="guardar()"
              [disabled]="loading">
        @if (loading) {
          <span class="dots-loader">
            <span></span><span></span><span></span>
          </span>
        } @else {
          Guardar cambios
        }
      </button>

    </div>

  </div>
</ion-content>
