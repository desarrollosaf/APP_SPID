<ion-app>

  <!-- ══ SPLASH SCREEN ══ -->
  @if (!splashDone) {
    <div class="splash" [class.splash--exit]="splashExiting">
      <div class="sp-blob sp-blob--1"></div>
      <div class="sp-blob sp-blob--2"></div>

      <div class="sp-body">
        <img src="assets/congreso_logo.png" alt="Congreso del Estado de México" class="sp-logo" />
        <div class="sp-subtitle">Sistema de Votación Digital</div>
        <div class="sp-progress"><span></span></div>
      </div>
    </div>
  }

  <!-- Overlay de cierre de sesión -->
  <div class="logout-overlay" [class.logout-overlay--visible]="loggingOut">
    <div class="lo-content">
      <div class="lo-ring">
        <ion-icon name="log-out-outline" class="lo-icon"></ion-icon>
      </div>
      <div class="lo-title">Cerrando sesión</div>
      <div class="lo-dots">
        <span></span><span></span><span></span>
      </div>
    </div>
  </div>

  <ion-split-pane contentId="main-content" when="false">
    <ion-menu contentId="main-content" type="overlay" [disabled]="!isAuthenticated">
      <ion-content>
        <div class="menu-wrap">

          <div class="menu-brand">
            <img src="assets/congreso_logo.png" alt="Congreso del Estado de México" />
            <span class="menu-brand-sub">Sistema de Votación Digital</span>
          </div>

          <nav class="menu-nav">
            @for (p of appPages; track p) {
              @if (p.action !== 'logout' && (!p.soloPresidente || esPresidente)) {
                <ion-menu-toggle auto-hide="false">
                  <a class="menu-item" routerDirection="root" [routerLink]="[p.url]" routerLinkActive="selected">
                    <span class="menu-ico"><ion-icon [name]="p.icon + '-outline'"></ion-icon></span>
                    <span class="menu-label">{{ p.title }}</span>
                    <ion-icon name="chevron-forward" class="menu-chev"></ion-icon>
                  </a>
                </ion-menu-toggle>
              }
            }
          </nav>

          @for (p of appPages; track p) {
            @if (p.action === 'logout') {
              <ion-menu-toggle auto-hide="false">
                <button class="menu-logout" type="button" (click)="logout()">
                  <ion-icon name="log-out-outline"></ion-icon>
                  <span>{{ p.title }}</span>
                </button>
              </ion-menu-toggle>
            }
          }

        </div>
      </ion-content>
    </ion-menu>
    <ion-router-outlet id="main-content"></ion-router-outlet>
  </ion-split-pane>
</ion-app>
