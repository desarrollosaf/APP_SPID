<ion-app>

  <!-- ══ SPLASH SCREEN ══ -->
  @if (!splashDone) {
    <div class="splash" [class.splash--exit]="splashExiting">

      <!-- Anillos de pulso -->
      <div class="sp-ring sp-ring--1"></div>
      <div class="sp-ring sp-ring--2"></div>
      <div class="sp-ring sp-ring--3"></div>

      <!-- Partículas doradas -->
      <span class="sp-p sp-p--1"></span>
      <span class="sp-p sp-p--2"></span>
      <span class="sp-p sp-p--3"></span>
      <span class="sp-p sp-p--4"></span>
      <span class="sp-p sp-p--5"></span>
      <span class="sp-p sp-p--6"></span>

      <!-- Contenido central -->
      <div class="sp-body">
        <div class="sp-seal">
          <div class="sp-seal-glow"></div>
          <ion-icon name="business-outline" class="sp-icon"></ion-icon>
        </div>
        <div class="sp-title">Congreso del Estado de México</div>
        <div class="sp-divider"><span></span></div>
        <div class="sp-subtitle">Sistema de Votación Digital</div>
      </div>

    </div>
  }

  <!-- Overlay de cierre de sesión -->
  <div class="logout-overlay" [class.logout-overlay--visible]="loggingOut">
    <div class="lo-content">
      <div class="lo-ring">
        <ion-icon name="log-out-outline" class="lo-icon"></ion-icon>
      </div>
      <div class="lo-title">Cerrando sesión</div>
      <div class="lo-dots">
        <span></span><span></span><span></span>
      </div>
    </div>
  </div>

  <ion-split-pane contentId="main-content">
    <ion-menu contentId="main-content" type="overlay" [disabled]="!isAuthenticated">
      <ion-content>
        <ion-list id="inbox-list">
          <ion-list-header>Inicio</ion-list-header>
          <ion-note>Congreso del Estado de Mexico </ion-note>

          @for (p of appPages; track p; let i = $index) {
            <ion-menu-toggle auto-hide="false">
              @if (p.action === 'logout') {
                <ion-item lines="none" detail="false" (click)="logout()">
                  <ion-icon slot="start" ios="log-out-outline" md="log-out-sharp"></ion-icon>
                  <ion-label>{{ p.title }}</ion-label>
                </ion-item>
              } @else {
                <ion-item routerDirection="root" [routerLink]="[p.url]" lines="none" detail="false" routerLinkActive="selected">
                  <ion-icon slot="start" [ios]="p.icon + '-outline'" [md]="p.icon + '-sharp'"></ion-icon>
                  <ion-label>{{ p.title }}</ion-label>
                </ion-item>
              }
            </ion-menu-toggle>
          }
          
        </ion-list>

        <!-- <ion-list id="labels-list">
          <ion-list-header>Labels</ion-list-header>

          @for (label of labels; track label) {
            <ion-item lines="none">
              <ion-icon aria-hidden="true" slot="start" ios="bookmark-outline" md="bookmark-sharp"></ion-icon>
              <ion-label>{{ label }}</ion-label>
            </ion-item>
          }
        </ion-list> -->
      </ion-content>
    </ion-menu>
    <ion-router-outlet id="main-content"></ion-router-outlet>
  </ion-split-pane>
</ion-app>
